version: 1.0
runtime: docker
build:
  commands:
    build:
      - echo "Building Tech Tombola container..."
run:
  command: /app/entrypoint.sh
  network:
    port: 10000
    env: PORT
  secrets:
    - name: JWT_SECRET
      value-from: "arn:aws:secretsmanager:<AWS_REGION>:<AWS_ACCOUNT_ID>:secret:techtombola/jwt_secret"
    - name: SESSION_SECRET
      value-from: "arn:aws:secretsmanager:<AWS_REGION>:<AWS_ACCOUNT_ID>:secret:techtombola/session_secret"
    - name: SUPER_ADMIN_BOOTSTRAP_SECRET
      value-from: "arn:aws:secretsmanager:<AWS_REGION>:<AWS_ACCOUNT_ID>:secret:techtombola/bootstrap_secret"
    - name: DATABASE_URL
      value-from: "arn:aws:secretsmanager:<AWS_REGION>:<AWS_ACCOUNT_ID>:secret:techtombola/database_url"
  configuration:
    env:
      - name: NODE_ENV
        value: "production"
      - name: LOG_LEVEL
        value: "info"
